yarnPath: .yarn/releases/yarn-4.13.0.cjs

nodeLinker: node-modules

npmAuditIgnoreAdvisories:
  - 'eslint (deprecation)' # ESLint 9 is EOL; the audit finding is a deprecation, not a patched CVE
  - '@ledgerhq/hw-transport-node-hid-noevents (deprecation)' # replacement is the DMK transport kit; ledgerjs-hw-app-cardano still needs a legacy Transport
  - '@ledgerhq/hw-transport-node-speculos (deprecation)' # same as above; dev only (Speculos integration tests)
  - 1119441 # uuid - missing buffer bounds check (moderate, no patched 8.x; @keystonehq/bc-ur-registry-cardano@0.5.0 pins uuid@^8.3.2)
  - '@ledgerhq/errors (deprecation)' # same as the Ledger transports
  - 'prebuild-install (deprecation)' # node-hid, pkg; install time only
  - 1244013 # glob; fix only in new major, dev only
  - 1244623 # minimatch; fix only in new major, dev only
