version: 2.1

defaults: &defaults
  docker:
    - image: cimg/node:18.7.0

commands:
  setup:
    steps:
      - checkout
      - run: node --version
      - run: sudo apt-get -y update
      - run: sudo apt-get -y install libudev-dev libusb-1.0-0-dev
      # sudo needed: /usr/local/bin is root-owned in cimg/node and corepack enable symlinks into it
      # https://github.com/CircleCI-Public/cimg-node/issues/277
      - run: sudo corepack enable
      - run: yarn install

jobs:
  audit:
    <<: *defaults
    steps:
      - setup
      - run: yarn npm audit

  lint:
    <<: *defaults
    steps:
      - setup
      - run: yarn prettier:check
      - run: yarn spell:check
      - run: yarn lint

  build_and_test:
    <<: *defaults
    steps:
      - setup
      - run: yarn build-js
      - run: yarn test-unit
      - run: yarn test-bin

workflows:
  version: 2
  all:
    jobs:
      - audit
      - lint
      - build_and_test
