version: 2.1

defaults: &defaults
  docker:
    - image: cimg/node:22.14

commands:
  setup:
    steps:
      - checkout
      - run: node --version
      - run: sudo apt-get -y update
      - run: sudo apt-get -y install libudev-dev libusb-1.0-0-dev
      # sudo needed: /usr/local/bin is root-owned in cimg/node and corepack enable symlinks into it
      # https://github.com/CircleCI-Public/cimg-node/issues/277
      - run: sudo corepack enable
      - run: yarn install

  setup_macos:
    steps:
      - checkout
      - run:
          name: Set up Node and Yarn
          command: |
            set -ex
            brew install node@22
            echo 'export PATH="/opt/homebrew/opt/node@22/bin:$PATH"' >> "$BASH_ENV"
            node --version
            corepack enable
            yarn --version
      - run:
          name: Install dependencies
          command: |
            set -ex
            yarn install

jobs:
  audit:
    <<: *defaults
    steps:
      - setup
      - run: yarn npm audit

  lint:
    <<: *defaults
    steps:
      - setup
      - run: yarn prettier:check
      - run: yarn spell:check
      - run: yarn lint

  build_and_test:
    <<: *defaults
    steps:
      - setup
      - run: yarn build-js
      - run: yarn test-unit
      - run: yarn test-bin
      - store_artifacts:
          path: build/release
          destination: release-binaries

  # Builds the linux-arm64 artifact natively (arm resource class) and, most
  # importantly, executes it: cross-built arm64 binaries used to ship with
  # incomplete pkg snapshots that crash on startup (see issue #194), which
  # only running the binary can catch.
  build_and_test_linux_arm64:
    docker:
      - image: cimg/node:22.14
    resource_class: arm.medium
    steps:
      - setup
      - run: yarn build-linux-tar-arm64
      - run: ./build/linux/archive-arm64/cardano-hw-cli/cardano-hw-cli version
      - store_artifacts:
          path: build/linux/archive-arm64
          destination: linux-arm64-binaries

  build_macos_artifacts:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    environment:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - setup_macos
      - run:
          name: Build macOS artifacts
          no_output_timeout: 45m
          command: |
            set -ex
            ./scripts/build-macos-all.sh
            ls -la build/release/
      - store_artifacts:
          path: build/release
          destination: macos-release-binaries

workflows:
  version: 2
  all:
    jobs:
      - audit
      - lint
      - build_and_test
      - build_and_test_linux_arm64
      - build_macos_artifacts
